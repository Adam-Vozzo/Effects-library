# GitHub Pages serves the main branch as-is, so the production build is committed in docs/
# (index.html at the repo root redirects there). This rebuilds docs/ on every push to main and
# checks that pull requests build.
name: Build site

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - name: Commit docs/
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ is already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild docs/ for GitHub Pages'
          git pull --rebase origin main
          git push origin HEAD:main
